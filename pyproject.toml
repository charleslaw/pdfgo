[project]
name = "pdfgo"
version = "0.3.0"
description = "A simple python package for editing pdfs via command line. A light wrapper around pypdf."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Charles Law" }]
dependencies = [
    "pypdf>=4.0",
]

[project.scripts]
pdfgo = "pdfgo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfgo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
